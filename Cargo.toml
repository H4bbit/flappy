[package]
name = "flappy"
version = "0.1.0"
edition = "2024"

[patch.crates-io]
miniquad = { git = "https://github.com/H4bbit/miniquad", branch = "termux-x11" }

[dependencies]
macroquad = "=0.4.15"
miniquad = { git = "https://github.com/H4bbit/miniquad", branch = "termux-x11", features = ["termux-x11"] }

[profile.release]
lto = true
opt-level = "z"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = false
